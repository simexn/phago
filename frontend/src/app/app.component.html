<nav
  class="top-nav"
  [class.settings-nav]="isProfileSection"
  aria-label="Main navigation"
>
  @if (isProfileSection) {
    <button class="back-link" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline" />
    </button>
  }
  <a class="brand" routerLink="/" aria-label="Phago home"
    ><img src="assets/phago-logo.png" alt="Phago"
  /></a>
  @if (!isProfileSection) {
    <a class="profile-link" routerLink="/profile" aria-label="Profile settings"
      ><ion-icon name="person-circle-outline"
    /></a>
  }
</nav>

<router-outlet />

@if (!isProfileSection) {
  <nav class="bottom-nav" aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon name="home-outline" />
      <span>Today</span>
    </a>
    <a
      class="add-link"
      routerLink="/add-food"
      routerLinkActive="active"
      aria-label="Add food"
    >
      <ion-icon name="add-outline" />
    </a>
    <a routerLink="/meals" routerLinkActive="active">
      <ion-icon name="calendar-outline" />
      <span>Meals</span>
    </a>
  </nav>
}
